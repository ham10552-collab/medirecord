name: medirecord
description: MediRecord - Patient Medical Records Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  path: ^1.9.0
  path_provider: ^2.1.6
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.0
  pdf: ^3.10.0
  csv: ^6.0.0
  share_plus: ^10.0.0
  intl: ^0.19.0
  uuid: ^4.4.0
  image_picker: ^1.1.0
  cached_network_image: ^3.3.1
  firebase_core_platform_interface: ^8.0.0
  localstorage: ^5.0.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
